# This repo's OWN gate - the one workflow that really runs here.
# (Everything under standard/.github/ is a TEMPLATE shipped to client repos and is
# never enabled in this repository.)
name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.18.0"
      - name: tree-check (one tree, no leaks, skeleton verifies)
        run: node tools/tree-check.mjs
      - name: link-check (every relative md link resolves)
        run: node tools/link-check.mjs
      - name: prose-check (no line renders as something it is not) + its cases
        run: |
          node tools/prose-check.mjs
          node tools/prose-check.mjs --self
      - name: spec-structure (the repo's own specs stay shaped and owned)
        run: node standard/scripts/spec-structure.mjs
      - name: provenance-check (every spec-engine file names where it came from) + its cases
        run: |
          node tools/provenance-check.mjs
          node tools/provenance-check.mjs --self
      - name: spec coupling (diff-gated on PRs, audited in full on every run)
        # The full audit is the PR gate, not a release ritual - a change that
        # breaks spec<->code coupling fails here, never in a later sweep.
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --quiet origin "${{ github.base_ref }}"
            node standard/scripts/spec-guard.mjs --base "origin/${{ github.base_ref }}" --block
          fi
          node standard/scripts/spec-guard.mjs --audit --block
      - name: spec-guard test (the coupling guard still fires where it must)
        run: node tools/spec-guard-test.mjs
      - name: clarify-gate test (a spec that is not settled cannot reach plan or tasks)
        run: node tools/clarify-gate-test.mjs
      - name: schema-pair test (the R24 pair check catches a drifted twin)
        run: node tools/schema-pair-test.mjs
      - name: cycle-guard test (an intent cannot be in two places)
        run: node tools/cycle-guard-test.mjs
      - name: self-verify fill + drift test (placeholder warning clearable; removed skill/section is drift)
        run: node tools/self-verify-fill-test.mjs
      - name: self-verify drift test (content, declared keys and the bounds on exceptions)
        run: node tools/self-verify-drift-test.mjs
      - name: facts-check (a restated fact agrees with its source) + its test
        run: |
          node standard/scripts/facts-check.mjs
          node tools/facts-check-test.mjs
      - name: decision-records-check (the ADR/BDR index agrees with the directory) + its test
        run: |
          node standard/scripts/decision-records-check.mjs --block
          node tools/decision-records-check-test.mjs
      - name: file-map is regenerated from the manifest, not hand-written
        run: node tools/file-map.mjs --check
      - name: validation suite (render matches the data; no unwaived open failure) + its test
        run: |
          node tools/validation.mjs --check
          node tools/validation-test.mjs
      - name: site (generate + check landing and docs) + the landing gate's test
        run: |
          node tools/docsite.mjs
          node tools/site-check.mjs
          node tools/site-behaviour.mjs
          node tools/site-check-test.mjs
