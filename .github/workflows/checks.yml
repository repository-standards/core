# This repo's OWN gate - the one workflow that really runs here.
# (Everything under standard/.github/ is a TEMPLATE shipped to client repos and is
# never enabled in this repository.)
name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.18.0"
      - name: tree-check (one tree, no leaks, skeleton verifies) + its cases
        run: |
          node tools/tree-check.mjs
          node tools/tree-check.mjs --self
      - name: link-check (every relative md link resolves)
        run: node tools/link-check.mjs
      - name: prose-check (no line renders as something it is not, no long dash) + its cases
        run: |
          node tools/prose-check.mjs
          node tools/prose-check.mjs --self
      - name: skill-format-check (every shipped skill still conforms to the Agent Skills format) + its cases
        run: |
          node tools/skill-format-check.mjs
          node tools/skill-format-check.mjs --self
      - name: spec-structure (the repo's own specs stay shaped and owned)
        run: node standard/scripts/spec-structure.mjs
      - name: provenance-check (every spec-engine file names where it came from) + its cases
        run: |
          node tools/provenance-check.mjs
          node tools/provenance-check.mjs --self
      - name: elicitation (every declared point has a call site, and the guard still refuses)
        # Three layers, three checks, because each catches what the one before it lets past:
        # the points check proves every declared point has a call site, the transcript
        # checker proves an answer was actually given, and the guard test proves the hook
        # that refuses the write is still alive. The guard is the one that cannot be
        # skipped by an agent, so it is also the one whose silence would go unnoticed.
        run: |
          node tools/elicitation-points-check.mjs
          node tools/elicitation-check-test.mjs
          node tools/elicitation-guard-test.mjs
      - name: spec coupling (diff-gated on PRs, audited in full on every run)
        # The full audit is the PR gate, not a release ritual - a change that
        # breaks spec<->code coupling fails here, never in a later sweep.
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --quiet origin "${{ github.base_ref }}"
            node standard/scripts/spec-guard.mjs --base "origin/${{ github.base_ref }}" --block
          fi
          node standard/scripts/spec-guard.mjs --audit --block
      - name: spec-guard test (the coupling guard still fires where it must)
        run: node tools/spec-guard-test.mjs
      - name: clarify-gate test (a spec that is not settled cannot reach plan or tasks)
        run: node tools/clarify-gate-test.mjs
      - name: schema-pair test (the R24 pair check catches a drifted twin)
        run: node tools/schema-pair-test.mjs
      - name: sprint-guard test (an intent cannot be in two places)
        run: node tools/sprint-guard-test.mjs
      - name: dashboard status test (a hand-written status cell is read as the state it names)
        run: node tools/dashboard-status-test.mjs
      # The shipped agent guards only print when they refuse, so nothing here notices a
      # regression in them unless their own suite runs. It did not, which is how a bypass
      # in the remote-database guard shipped with every check on this list green.
      - name: agent guards (the shipped PreToolUse hooks deny and allow what they should)
        run: bash standard/scripts/verifyAgentGuards.sh
      - name: self-verify fill + drift test (placeholder warning clearable; removed skill/section is drift)
        run: node tools/self-verify-fill-test.mjs
      - name: self-verify drift test (content, declared keys and the bounds on exceptions)
        run: node tools/self-verify-drift-test.mjs
      - name: facts-check (a restated fact agrees with its source) + its test
        run: |
          node standard/scripts/facts-check.mjs
          node tools/facts-check-test.mjs
      - name: decision-records-check (the ADR/BDR index agrees with the directory) + its test
        run: |
          node standard/scripts/decision-records-check.mjs --block
          node tools/decision-records-check-test.mjs
      - name: adoption-gates test (a gate artifact that exists but says nothing still fails)
        run: node tools/adoption-gates-test.mjs
      - name: backlog-archive-check (a closed row reached the archive) + its test
        # The removal check needs a base to diff against; the archive's own checks do not.
        # Passing an empty base_ref on a push to main would degrade the run to "nothing to
        # compare" and read as a pass.
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --quiet origin "${{ github.base_ref }}"
            node standard/scripts/backlog-archive-check.mjs --base "origin/${{ github.base_ref }}" --block
          else
            node standard/scripts/backlog-archive-check.mjs --block
          fi
          node tools/backlog-archive-check-test.mjs
      - name: dashboard ideas test (an idea reaches the pool as a file or as a row, once either way)
        run: node tools/dashboard-ideas-test.mjs
      - name: dashboard discovery test (an entry is summarised by what it says, not by its template)
        run: node tools/dashboard-discovery-test.mjs
      - name: file-map is regenerated from the manifest, not hand-written
        run: node tools/file-map.mjs --check
      - name: skill-map is regenerated from the skills, and every skill is grouped
        run: node tools/skill-map.mjs --check
      - name: validation suite (render matches the data; no unwaived open failure) + its test
        run: |
          node tools/validation.mjs --check
          node tools/validation-test.mjs
      - name: human-prompting suite (ids unique, citations resolve, fractions match the rows) + its test
        run: |
          node tools/human-prompting.mjs --check
          node tools/human-prompting-test.mjs
      - name: site (generate + check landing and docs) + the landing gate's test
        run: |
          node tools/docsite.mjs
          node tools/site-check.mjs
          node tools/site-behaviour.mjs
          node tools/site-check-test.mjs
      # `tools/gates.mjs` runs this file locally before a push. It reads the list from here
      # rather than keeping its own, so the way it fails is by reading fewer steps than are
      # written - a green subset, reported as a full pass. This is what counts them.
      - name: gates runner test (the pre-push command reads this file whole, or refuses)
        run: node tools/gates-test.mjs
