# The Docker test-stack - real backing services for the integration and e2e tiers.
# Ephemeral by design (see ../DECISIONS.md #9):
#   - non-default host ports, so a test run never collides with a dev DB
#   - tmpfs-backed, so data is disposable and startup is fast
#   - healthchecks, so `bootstrap:test-stack` waits for READY, not just started
# `pnpm bootstrap:test-stack` brings it up healthy; `pnpm teardown:test-stack` drops it.
# The SAME file runs locally and in CI - no "works on my machine" gap.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "55432:5432" # non-default host port - won't clash with a local dev Postgres
    tmpfs:
      - /var/lib/postgresql/data # disposable; nothing survives teardown
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379" # non-default host port
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
