# Quality gate - format + types + lint, Turbo-cached. A TEMPLATE for an adopting repo
# (this file does not run in the standard's own repo).
#
# Hardened per DECISIONS.md #8: explicit least-privilege permissions (the one place the
# standard improves on stayget, whose ci.yml had no top-level permissions block), pnpm
# store cache, and a frozen lockfile. Further hardening: pin third-party actions by SHA.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: this job only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Format, types, and lint
        run: pnpm check:all

      # Also run the standard's compliance gate if the repo is aligned:
      # - name: Self-verify
      #   run: node scripts/self-verify.mjs
