name: spec-guard

# Pull requests AND pushes to the default branch. The push trigger is the one that makes
# "gated from the first push" true: a pull_request-only workflow never runs on a direct
# push to main - including the very first one, when the repository has no pull requests at
# all and every file in it is arriving unchecked. The sibling secret scan has carried a push
# trigger for the same reason; this one had not.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: spec-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-guard:
    # Two spec-policy gates (dependency-free, node + git only, no install):
    #  - structure: no ticket-numbered spec paths (specs/<capability>/, not NNN-*)
    #  - coupling: a mapped capability's code changed without touching its spec
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Exact version, not `node-version-file: .nvmrc`: this workflow is a REQUIRED
          # manifest entry and `.nvmrc` is an optional one, so reading the file made a
          # required gate depend on something no repo is required to carry - and least of
          # all a repo that is not a Node repo, which is who this template is hardest to get
          # right for. If your repo does carry `.nvmrc`, swapping this back for
          # `node-version-file` is a good local adaptation (this entry is merge-class).
          node-version: "24.18.0"
          # This job installs no package manager; do not try to restore its cache.
          package-manager-cache: false
      - name: Self-verify (standard compliance)
        # .standards-version pin + core skeleton + structure guard (static, whole-repo).
        # Needs no diff, so it is the same check on a push and on a pull request.
        run: node scripts/self-verify.mjs
      - name: Spec structure guard
        # A pull request has a base branch to diff against. A push does not, so the whole
        # tree is checked instead - stricter, and the only reading that means anything on
        # the first push, when there is no "before" to compare with.
        #
        # The event's values arrive through `env`, never interpolated into the script: a
        # branch name is contributor-controlled text, and `${{ }}` pastes it into the shell
        # before bash ever sees a quote.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF"
            node scripts/spec-structure.mjs --base "origin/$BASE_REF" --block
          else
            node scripts/spec-structure.mjs --block
          fi
      - name: Spec policy coupling guard (blocks at scale, advises at core)
        # The repo's manifest copy declares its profile (ADR-011); the blocking
        # coupling gate is a scale-profile prescription (R11).
        #
        # Coupling is a statement about a change, so it needs two sides. On a push the
        # earlier side is the commit the branch was at; on the first push there is none
        # (all-zeros), and after a force-push it may no longer exist in this checkout - both
        # are checked for rather than assumed, because a guard that dies on a missing ref
        # reports the same red as a guard that found a violation.
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          PROFILE=$(node -p "try { JSON.parse(require('fs').readFileSync('standard.manifest.json','utf8')).profile || 'scale' } catch { 'scale' }")
          BLOCK="--block"
          if [ "$PROFILE" = "core" ] || [ "$PROFILE" = "solo" ]; then BLOCK=""; fi
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF"
            node scripts/spec-guard.mjs --base "origin/$BASE_REF" $BLOCK
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            node scripts/spec-guard.mjs --base "$BEFORE" $BLOCK
          else
            echo "No earlier commit to diff against - the full-tree audit below is the gate for this push."
          fi
      - name: Backlog archive guard
        # A row leaves backlog.md only into an archive. Like the coupling guard this is a
        # statement about a change, so it takes the same base and skips when there is none;
        # self-verify notes diff-kind guards instead of running them, so this step is the
        # only place the check fires.
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF"
            node scripts/backlog-archive-check.mjs --base "origin/$BASE_REF" --block
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            node scripts/backlog-archive-check.mjs --base "$BEFORE" --block
          else
            echo "No earlier commit to diff against - no removed backlog row to judge on this push."
          fi
      - name: Spec coupling audit (full tree, every run)
        # Orphan specs and unmapped capabilities do not wait for a release ritual.
        # Deliberately blocking at every profile: the audit checks structure, not
        # conduct - a spec with no map entry is broken at core too. It needs no diff,
        # which is what makes it the gate on a first push.
        run: node scripts/spec-guard.mjs --audit --block
      - name: Agent guards self-test
        # The PreToolUse hooks print only when they refuse, so a broken one is silent - it
        # stops protecting a remote database and nothing says so. Their suite is the only
        # signal, and a signal nobody runs is not one: a bypass shipped in the shipped guard
        # while every check on this list was green, because the suite existed and no
        # workflow called it. Optional entries, so a repo that did not take the hooks has
        # nothing to check and says so rather than failing.
        run: |
          set -euo pipefail
          if [ -f scripts/verifyAgentGuards.sh ] && [ -d .claude/hooks ]; then
            bash scripts/verifyAgentGuards.sh
          else
            echo "no agent guards in this repo - nothing to self-test"
          fi
