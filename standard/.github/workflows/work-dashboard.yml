# Builds the work dashboard - one page showing the backlog, the cycles, the timeline, the
# decisions and the changelog - and decides where it may go by how visible this repository is.
#
# The page contains nothing the repository does not already contain, which is exactly why
# publishing it needs a decision rather than a default: a private repository's backlog is
# private, and **GitHub Pages on a private repository is served publicly** unless the
# organisation is on Enterprise Cloud with access control. That is the trap this file exists
# to close - the publish job is gated on the repository actually being public, so turning
# Pages on cannot leak a private board by accident.
#
#   public repository   -> the page is published, and being able to point at it is a feature
#   private repository  -> the page is a build artifact, readable by whoever can read the repo
#
# Pages has no password of its own, so a private repository that wants a link sets the
# WORK_DASHBOARD_PASSWORD secret: the build is then encrypted and the publish step opens up,
# because what sits on the URL is ciphertext. Without that secret a private repository stops
# at the artifact - which is also a fine answer, and the one that needs no decision.
#
# Add `--anonymise` to the build if the page should carry no colleague's name.
name: work-dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      locked: ${{ steps.build.outputs.locked }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Exact version, not `node-version-file: .nvmrc`: a shipped workflow states its own
          # pin rather than deferring it to a file the repo is not required to carry. If your
          # repo does carry `.nvmrc`, swapping this back is a good local adaptation.
          node-version: "24.18.0"
          package-manager-cache: false

      # No dependencies, no install: the generator is Node built-ins only.
      #
      # Set a repository secret named WORK_DASHBOARD_PASSWORD and the build is encrypted -
      # what gets hosted is ciphertext, opened in the reader's browser by that one password.
      # That is what makes publishing from a private repository safe below.
      - name: Build the page
        id: build
        env:
          WORK_DASHBOARD_PASSWORD: ${{ secrets.WORK_DASHBOARD_PASSWORD }}
        run: |
          if [ -n "$WORK_DASHBOARD_PASSWORD" ]; then
            node scripts/work-dashboard.mjs --lock --out _work/index.html
            echo "locked=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/work-dashboard.mjs --out _work/index.html
            echo "locked=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: work-dashboard
          path: _work
          retention-days: 30

  publish:
    needs: build
    # The gate: publish when the repository is public and there is nothing to protect, or
    # when the build is encrypted and the URL gives away nothing without the password. A
    # private repository with no password set never reaches this job, whatever the Pages
    # settings say - which is the accident this exists to prevent.
    if: github.event.repository.visibility == 'public' || needs.build.outputs.locked == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: work-dashboard
          path: _work
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _work
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
