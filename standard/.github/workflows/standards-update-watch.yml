name: standards-update-watch

# TEMPLATE - enable this in a repo that adopted the standard. It never runs in the
# standards repo itself.
#
# ADR-025: staying current is a *notification*, never a lock. Nothing here edits the
# pin or opens a PR against your code - it tells you a newer standard exists and lets
# a human decide when to run `update-to-version`. A watch that bumps by itself would
# make "aligned" a thing that happens while nobody is looking.

on:
  schedule:
    # Monday morning, off the hour - a weekly nudge, not a build gate.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Compare the pin against the standard's newest release
        env:
          GH_TOKEN: ${{ github.token }}
          # The standard this repo follows. Change it if you consume a fork.
          STANDARD_REPO: bodurkalukasz/repository-standards
        run: |
          set -euo pipefail

          if [ ! -f .standards-version ]; then
            echo "no .standards-version - this repo was never aligned; run align-to-standards"
            exit 0
          fi
          PIN=$(tr -d '[:space:]' < .standards-version)

          # No releases yet is a normal state, not a failure: the watch is installed
          # before the first tag exists and starts speaking when one does.
          LATEST=$(gh api "repos/${STANDARD_REPO}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "${LATEST}" ]; then
            echo "${STANDARD_REPO} has published no release yet - nothing to compare ${PIN} against"
            exit 0
          fi
          LATEST=${LATEST#v}

          if [ "${PIN}" = "${LATEST}" ]; then
            echo "pinned at ${PIN}, which is the newest release - nothing to do"
            exit 0
          fi
          # sort -V puts the newer version last; if that is the pin, this repo is ahead
          # of the published release (a pre-release pin), which is not a miss.
          NEWEST=$(printf '%s\n%s\n' "${PIN}" "${LATEST}" | sort -V | tail -1)
          if [ "${NEWEST}" = "${PIN}" ]; then
            echo "pinned at ${PIN}, ahead of the newest release ${LATEST} - nothing to do"
            exit 0
          fi

          TITLE="Standards update available: ${PIN} -> ${LATEST}"
          # One issue per target version: a weekly cron must not mint a weekly issue.
          EXISTING=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "${EXISTING}" ]; then
            echo "issue #${EXISTING} already tracks ${LATEST}"
            exit 0
          fi

          gh issue create --title "${TITLE}" --body "$(printf '%s\n' \
            "\`.standards-version\` pins **${PIN}**; ${STANDARD_REPO} has released **${LATEST}**." \
            "" \
            "This is a notification, not a requirement (ADR-025). The pin records the state this repo last aligned to; the target of an update is always the latest." \
            "" \
            "To take it, in this repo:" \
            "" \
            "    > update this repo to standards ${LATEST}" \
            "" \
            "The \`update-to-version\` skill applies the delta between the pin and latest, preserves the deviations recorded in this repo's manifest, and finishes when \`node scripts/self-verify.mjs\` reports drift 0." \
            "" \
            "Closing this issue without updating is a valid answer - say why in a comment, so the next person does not re-open the same question.")"
