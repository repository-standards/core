# gitleaks config (repository-standards baseline)
# Scans staged commits (pre-commit hook) + PR/push range (CI).
# Principle: secrets never live in the repo - secret manager + env vars only.
# `[[allowlists]]` and `targetRules` need a recent gitleaks 8.x; the shipped workflow pins
# the version it is tested against.

title = "gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Paths and patterns allowed to contain secret-like strings."
# No blanket entry for docs/: `docs/discovery/` is where the standard tells the agent to
# paste meeting notes, mails and transcripts, and runbooks carry real command lines - the
# two places in the tree most likely to receive a live credential. Placeholder-shaped
# findings in templates are covered by the `regexes` below, which match the secret itself.
paths = [
  '''(.*/)?\.env\.example$''',
  '''(.*/)?\.env\.sample$''',
  '''(.*/)?pnpm-lock\.yaml$''',
  '''(.*/)?package-lock\.json$''',
  '''(.*/)?yarn\.lock$''',
]
regexes = [
  '''EXAMPLE''',
  '''your-.*-here''',
  '''<.*>''',
]

# A manifest entry is a path and the sha256 of the file at it, so where the path carries a
# word the entropy rule keys on - a hook called `no-ci-secret-writes.sh` - the hash beside
# it reads as a credential and the adoption commit fails the scan on a shipped file.
#
# Scoped by shape, not by file. `paths` is the wrong tool: gitleaks matches it before it
# evaluates `condition`, so a path entry switches the rule off for the whole file whatever
# else the allowlist says. This matches the line - a JSON key whose entire value is 64
# lowercase hex characters - and only for `generic-api-key`, so every named-vendor rule
# still fires everywhere, manifests included.
[[allowlists]]
description = "sha256 values recorded by manifest-hashes."
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*"[^"]+":\s*"[a-f0-9]{64}",?\s*$''']

# Add repo-specific vendor-key rules below (optional), e.g.:
# [[rules]]
# id = "vendor-api-key"
# description = "Vendor API key must live in the secret manager only."
# regex = '''(?i)VENDOR_API_KEY\s*[:=]\s*['"][A-Za-z0-9\-_]{16,}['"]'''
# tags = ["vendor", "secret"]
