<div class="lab">
  <div class="head">
    <span class="eyebrow">Who it's for &middot; option A (CSS / SVG)</span>
    <h1>Specify. Detail. Build. Forever.</h1>
    <p>A minimal loop: a single comet travels the ring past the three roles while the dashed flow rotates - <b>specify -&gt; detail -&gt; build</b>, then around again. No JavaScript.</p>
  </div>

  <div class="stage">
    <svg class="wheel" viewBox="0 0 440 440" role="img" aria-label="An endless loop between three roles: PO specifies, Architect and Dev detail, AI builds - then around again.">
      <defs>
        <linearGradient id="loopgrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFB454"/>
          <stop offset="1" stop-color="#4EC9A6"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="220" cy="220" r="150"/>
      <circle class="flowring" cx="220" cy="220" r="150"/>
      <g class="comet">
        <circle cx="220" cy="70" r="13" fill="#4EC9A6" opacity="0.18"/>
        <circle cx="220" cy="70" r="6" fill="#4EC9A6"/>
      </g>
      <circle cx="220" cy="220" r="34" fill="#0D0E11" stroke="#242832"/>
      <text class="ctrbig" x="220" y="222">&#8635;</text>
      <text class="ctr" x="220" y="246">ENDLESS</text>
      <g>
        <circle class="node" cx="220" cy="70" r="42"/>
        <text class="rlabel" x="220" y="68">PO</text>
        <text class="rverb" x="220" y="84">SPECIFY</text>
      </g>
      <g>
        <circle class="node" cx="350" cy="295" r="42"/>
        <text class="rlabel" x="350" y="291" style="font-size:12.5px">ARCH+DEV</text>
        <text class="rverb" x="350" y="307">DETAIL</text>
      </g>
      <g>
        <circle class="node" cx="90" cy="295" r="42"/>
        <text class="rlabel" x="90" y="291">AI</text>
        <text class="rverb" x="90" y="307">BUILD</text>
      </g>
    </svg>
  </div>

  <div class="legend">
    <span><i style="background:#FFB454"></i> PO - Specify</span>
    <span><i style="background:#ECEDEF"></i> Architect + Dev - Detail</span>
    <span><i style="background:#4EC9A6"></i> AI - Build</span>
  </div>
</div>

<style>
  .lab{
    --ink:#0D0E11; --surface:#16181D; --line:#242832; --tx:#ECEDEF; --mid:#9BA1AB;
    --amber:#FFB454; --add:#4EC9A6;
    --mono: ui-monospace,"JetBrains Mono","SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--ink); color:var(--tx); font-family:var(--sans);
    min-height:100%; padding:40px 20px; display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .head{max-width:640px; text-align:center}
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber)}
  .head h1{font-family:var(--mono); font-size:clamp(24px,4vw,36px); margin:12px 0 10px; color:#fff; letter-spacing:-.01em; text-wrap:balance}
  .head p{color:var(--mid); font-size:15px; line-height:1.6; margin:0}
  .head b{color:var(--tx); font-weight:600}
  .stage{margin:26px 0 10px; width:100%; max-width:440px}
  .wheel{width:100%; height:auto; display:block}
  .wheel .track{fill:none;stroke:var(--line);stroke-width:2}
  .wheel .flowring{fill:none;stroke:url(#loopgrad);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:5 15;animation:flow 4.5s linear infinite}
  .wheel .comet{transform-box:view-box;transform-origin:220px 220px;animation:spin 9s linear infinite}
  .wheel .node{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
  .wheel .rlabel{font-family:var(--mono);fill:#fff;font-size:15px;font-weight:700;text-anchor:middle}
  .wheel .rverb{font-family:var(--mono);fill:var(--amber);font-size:10.5px;letter-spacing:.12em;text-anchor:middle}
  .wheel .ctrbig{fill:var(--add);font-size:30px;text-anchor:middle;font-family:var(--mono)}
  .wheel .ctr{fill:var(--mid);font-size:11px;letter-spacing:.18em;text-anchor:middle;font-family:var(--mono)}
  @keyframes flow{to{stroke-dashoffset:-200}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.wheel .flowring,.wheel .comet{animation:none}}
  .legend{display:flex; gap:22px; flex-wrap:wrap; justify-content:center; font-family:var(--mono); font-size:12.5px; color:var(--mid)}
  .legend span{display:inline-flex; align-items:center; gap:8px}
  .legend i{width:11px; height:11px; border-radius:50%; display:inline-block}
</style>
